[project]
name = "ai-reality-map-backend"
version = "0.1.0"
description = "AI Reality Map / Go — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt[crypto]>=5.3",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    # Geo
    "psycopg[binary]>=3.2",
    # Settings & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Background
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "redis>=5.1",
    # Storage
    "boto3>=1.35",
    # Auth
    "google-auth>=2.35",
    # AI
    "google-genai>=0.3",
    "anthropic>=0.39",
    # Image processing
    "pillow>=11.0",
    # Observability
    "sentry-sdk[django]>=2.17",
    "structlog>=24.4",
    # Server
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "dj-database-url>=3.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "factory-boy>=3.3",
    "respx>=0.21",
    "freezegun>=1.5",
    "pre-commit>=4.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
