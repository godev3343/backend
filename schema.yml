        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/checkins/:
    post:
      operationId: api_checkins_create
      description: |-
        POST /api/checkins

        Body: place_id, latitude, longitude, comment?, photo_key?
        Response: 201 + CheckInSerializer.
      tags:
      - checkins
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/checkins/{id}/like/:
    post:
      operationId: api_checkins_like_create
      description: |-
        POST /api/checkins/{id}/like:
          - первый лайк → 201
          - повторный → 200 (идемпотентно)
        DELETE /api/checkins/{id}/like:
          - лайк убран → 204
          - лайка не было → 204 (идемпотентно)

        В обоих случаях возвращаем актуальный likes_count, чтобы клиент мог
        обновить UI без отдельного запроса.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - checkins
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: api_checkins_like_destroy
      description: |-
        POST /api/checkins/{id}/like:
          - первый лайк → 201
          - повторный → 200 (идемпотентно)
        DELETE /api/checkins/{id}/like:
          - лайк убран → 204
          - лайка не было → 204 (идемпотентно)

        В обоих случаях возвращаем актуальный likes_count, чтобы клиент мог
        обновить UI без отдельного запроса.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - checkins
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/checkins/me/:
    get:
      operationId: api_checkins_me_list
      description: |-
        GET /api/checkins/me — история своих чек-инов с cursor-пагинацией.

        Свои лайки на свои же чек-ины показываем — теоретически юзер может
        лайкнуть свой чек-ин (мы это не запрещаем; если решим запретить —
        добавим в LikeService).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - checkins
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDetailList'
          description: ''
  /api/events/:
    get:
      operationId: api_events_list
      description: GET /api/events?from=...&to=...&bbox=...&limit=50&offset=0
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - events
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDetailList'
          description: ''
  /api/events/{id}/:
    get:
      operationId: api_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/feed/:
    get:
      operationId: api_feed_list
      description: GET /api/feed?cursor=...&limit=20
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - checkins
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDetailList'
          description: ''
  /api/friends:
    get:
      operationId: api_friends_retrieve
      description: GET /api/friends — список друзей.
      tags:
      - social
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/friends/{user_id}:
    delete:
      operationId: api_friends_destroy
      description: DELETE /api/friends/{user_id} — удалить из друзей.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/friends/requests:
    post:
      operationId: api_friends_requests_create
      description: POST /api/friends/requests — отправить заявку.
      tags:
      - social
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/friends/requests/{friendship_id}:
    delete:
      operationId: api_friends_requests_destroy
      description: DELETE /api/friends/requests/{id} — отменить свою исходящую.
      parameters:
      - in: path
        name: friendship_id
        schema:
          type: integer
        required: true
      tags:
      - social
      security:
