openapi: 3.0.3
info:
  title: AI Reality Map / Go API
  version: 0.1.0
  description: Социальная карта города с AI-разметкой вайба, чек-инами, знакомствами
    и геймификацией.
paths:
  /api/ai/recommend:
    post:
      operationId: api_ai_recommend_create
      description: |-
        POST /api/ai/recommend
        body: {"query": "куда пойти на свидание?"}
        response: {"items": [...], "request_id": 42}

        Onboarded-only — без preferred_vibes/ai_context AI знает только город,
        рекомендации будут слабыми. Throttle: 10/час на юзера (см. throttling.py).
      tags:
      - ai
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/email/verify/confirm:
    post:
      operationId: api_auth_email_verify_confirm_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/email/verify/request:
    post:
      operationId: api_auth_email_verify_request_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
