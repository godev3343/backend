  /api/auth/refresh:
    post:
      operationId: api_auth_refresh_create
      description: Стандартный SimpleJWT view — указан явно для документации.
      tags:
      - auth
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/register:
    post:
      operationId: api_auth_register_create
      tags:
