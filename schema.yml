      parameters:
      - in: path
        name: friendship_id
        schema:
          type: integer
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/friends/requests/incoming:
    get:
      operationId: api_friends_requests_incoming_retrieve
      description: GET /api/friends/requests/incoming — pending где я to_user.
      tags:
      - social
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/friends/requests/outgoing:
    get:
      operationId: api_friends_requests_outgoing_retrieve
      description: GET /api/friends/requests/outgoing — pending где я from_user.
      tags:
      - social
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/geocode/:
    get:
      operationId: api_geocode_retrieve
      tags:
      - geocoding
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/media/{asset_id}:
    get:
      operationId: api_media_retrieve
      description: |-
        GET /api/media/{asset_id}

        Возвращает текущее состояние asset'а. Фронт может polling-ом ждать
        PROCESSED после confirm — в EPIC 0 у нас polling-стратегия для realtime.

        Видеть свой asset разрешено в любом статусе. Чужие — 404 (не 403, чтобы
        не подтверждать факт существования id чужого юзера).
      parameters:
      - in: path
        name: asset_id
        schema:
          type: integer
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/places/:
    get:
      operationId: api_places_list
      description: |-
        GET /api/places?bbox=lng_min,lat_min,lng_max,lat_max&vibe=calm,active&category=cafe&limit=200

        bbox обязателен. vibe/category/limit опциональны.
        Возвращает максимум 500 мест (см. filters.MAX_LIMIT).
      tags:
      - places
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Detail'
          description: ''
  /api/places/{id}/:
    get:
      operationId: api_places_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - places
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/upload/confirm:
    post:
      operationId: api_upload_confirm_create
      description: |-
        POST /api/upload/confirm

        Body:
            {"asset_id": 42}

        Response 200:
            MediaAsset (status=pending; status станет processed после Celery-таски)
      tags:
      - media
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/upload/presign:
    post:
      operationId: api_upload_presign_create
      description: |-
        POST /api/upload/presign

        Body:
            {
                "purpose": "avatar" | "checkin" | "place",
                "content_type": "image/jpeg",
                "content_length": 1234567
            }

        Response 201:
            {
                "asset_id": 42,
                "upload_url": "https://...r2...?X-Amz-Signature=...",
                "key": "avatars/42/9c1.../original.jpg",
                "expires_in": 300
            }
      tags:
      - media
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/users/{user_id}:
    get:
      operationId: api_users_retrieve
      description: GET /api/users/{id} — публичный профиль другого юзера.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/users/me:
    get:
      operationId: api_users_me_retrieve
      description: GET и PATCH /api/users/me.
      tags:
      - users
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: api_users_me_partial_update
      description: GET и PATCH /api/users/me.
      tags:
      - users
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/users/me/onboarding:
    post:
      operationId: api_users_me_onboarding_create
      description: |-
        POST /api/users/me/onboarding — заполнить display_name, avatar_url, bio,
        проставить consent_at. Идемпотентно — повторный вызов перезапишет поля.
      tags:
      - users
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/users/me/points:
    get:
      operationId: api_users_me_points_list
      description: |-
        GET /api/users/me/points

        Возвращает историю начислений текущего юзера, отсортированную по
        created_at DESC. Cursor-пагинация по 50 на страницу.

        Permissions: IsAuthenticated. НЕ требуем IsOnboarded — историю можно
        смотреть и до завершения онбординга (если что-то уже начислено).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - gamification
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDetailList'
          description: ''
  /api/users/me/preferences:
    put:
      operationId: api_users_me_preferences_update
      description: PUT /api/users/me/preferences.
      tags:
      - social
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/users/search:
    get:
      operationId: api_users_search_retrieve
      description: |-
        GET /api/users/search?q=...&limit=&offset=

        Минимум 2 символа в q. Поиск по display_name и first_name (icontains),
        плюс точный email-матч. Текущего юзера из выдачи исключаем.
      tags:
      - users
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /health/:
    get:
      operationId: health_retrieve
      description: Liveness — приложение запущено и отвечает.
      tags:
      - system
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /ready/:
    get:
      operationId: ready_retrieve
      description: |-
        Readiness — БД и Redis доступны.

        Используется балансировщиком: если возвращает 503, трафик не пускается.
      tags:
      - system
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
components:
  schemas:
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
      required:
      - status
    PaginatedDetailList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Detail'
    Readiness:
      type: object
      properties:
        status:
          type: string
        db:
          type: boolean
        redis:
          type: boolean
      required:
      - db
      - redis
      - status
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Регистрация, логин, JWT, email-верификация, password reset, Google
    OAuth
- name: users
  description: Профиль текущего пользователя, онбординг, AI-предпочтения
- name: social
  description: Поиск пользователей, друзья, заявки
- name: media
  description: Загрузка фото через presigned URLs в R2
- name: places
  description: Заведения, вайбы, фото
- name: geocoding
  description: Геокодинг через Mapbox
- name: checkins
  description: Чек-ины, лента, лайки
- name: events
  description: Афиша
- name: ai
  description: AI-рекомендации «Куда пойти?»
- name: gamification
  description: Поинты и история транзакций
- name: system
  description: Health/readiness probes, схема API
