          description: ''
  /api/auth/login:
    post:
      operationId: api_auth_login_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout:
