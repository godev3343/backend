target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv"]

[lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # isort
    "N",                 # naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "DJ",                # django-specific
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "TID",               # tidy imports
    "PTH",               # pathlib over os.path
]
ignore = [
    "E501",              # line length — у форматтера свои правила
    "B008",              # mutable default args — DRF использует Default(...)
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]
"**/settings/*.py" = ["F405", "F403"]

[lint.isort]
known-first-party = ["apps", "config"]