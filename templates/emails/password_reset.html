<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сброс пароля</title>
</head>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eee;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#161616;border:1px solid #262626;border-radius:12px;">
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px 0;font-size:20px;color:#fff;">Сброс пароля</h1>
              <p style="margin:0 0 24px 0;font-size:14px;line-height:1.5;color:#aaa;">
                Нажмите кнопку, чтобы задать новый пароль:
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px auto;">
                <tr>
                  <td style="border-radius:8px;background:#cfff5e;">
                    <a href="{{ reset_url }}"
                       style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:600;color:#0a0a0a;text-decoration:none;">
                      Задать новый пароль
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 16px 0;font-size:13px;color:#888;word-break:break-all;">
                Или скопируйте ссылку:<br>
                <a href="{{ reset_url }}" style="color:#cfff5e;text-decoration:none;">{{ reset_url }}</a>
              </p>
              <p style="margin:0 0 8px 0;font-size:13px;color:#888;">
                Ссылка действительна {{ ttl_minutes }} минут.
              </p>
              <p style="margin:0;font-size:13px;color:#666;">
                Если вы не запрашивали сброс — игнорируйте это письмо.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0 0;font-size:12px;color:#555;">
          AI Reality Map · <a href="{{ frontend_url }}" style="color:#888;text-decoration:none;">{{ frontend_url }}</a>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
